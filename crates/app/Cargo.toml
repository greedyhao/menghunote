[package]
name = "menghunote-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# P1（同步产品化）：同步 UI 与 dev 专用权限拆成两个 feature。
#
# - `sync`：只表示"协议/能力"（`menghunote-sync` 依赖 + `sync_gate`），**不**提供
#   任何 UI（onboarding/dev_sync 模块都不编译）。`sync-ui` 隐含它。
# - `sync-ui`：产品同步 UI（`onboarding` + `dev_sync` 面板/设置/状态），公开配置
#   JSON 读写（serde/serde_json）与恢复码清零（zeroize）也在这里。**是默认 feature**：
#   `cargo run -p menghunote-app` 默认进入 `AppRoot` 同步向导，而不是直接开 dev vault。
# - `dev-sync`：在 `sync-ui` 之上额外开放 **dev 专用**能力：`local_dev` 模式
#   （`sync_gate::mode_allowed`）、`--dev-sync*` CLI/测试 setup、localhost relay 门禁、
#   V2 管理实验 UI。正式/产品构建不得启用它。
#
# 三段式而不是两个 feature 的原因：`sync-ui` 里有大量模块（面板/设置/自动同步）与
# `local_dev` 无关；历史上它们被 `dev-sync` 一并门禁，导致产品构建拿不到同步 UI。
# 本切片只拆编译门禁，不改协议/schema/网络行为。
default = ["sync-ui"]
sync = ["dep:menghunote-sync"]
sync-ui = ["sync", "dep:serde", "dep:serde_json", "dep:zeroize"]
dev-sync = ["sync-ui"]

[dependencies]
# 应用层错误汇总（库层用 thiserror，见 AGENTS.md §4）
anyhow = "1"
# 模板/日记的本地时间：chrono 0.4.45 早在 lockfile 里（gpui 的传递依赖），这里显式声明
# 并只开 `clock`（本地时区 + `Local::now`）。不引入新版本、不加构建脚本、不改 lock。
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 依赖基线见 AGENTS.md §1 / ADR 0004：gpui-kit 是 gpui-pre 的门面（含 gpui-base/gpui-component）。
# **精确 pin**：升级必须整体对齐（kit/pre/base/component 版本互相约束），不能单边升。
# 用依赖别名把 lib 名固定成 `gpui`，代码里 `use gpui::*` 与 `gpui::platform::` 保持不变。
gpui = { package = "gpui-kit", version = "=0.10.0" }
# 画布笔记（`.excalidraw`）的编辑器：vendor 的 Excalidraw 视图（MIT，见
# `crates/excalidraw/README.md`）。默认 feature 即可（它自己精确 pin gpui-kit 0.10.0），
# 三种构建（默认 / dev-sync / --no-default-features）都编进来；不引入新的版本解算。
gpui-excalidraw = { path = "../excalidraw" }
# ADR 0003 §3：app 可以依赖 editor / storage / text，反向不允许
menghunote-editor = { path = "../editor" }
# ADR 0020 P1：轻量 i18n（静态 catalog + 插值/复数），无 GPUI/无外部依赖。
menghunote-i18n = { path = "../i18n" }
# 检索（S4-2b）：UI 只拿类型（Hit/SearchStatus），真正的 IndexManager 在后台线程里
menghunote-search = { path = "../search" }
menghunote-storage = { path = "../storage" }
# 同步（ADR 0009）：**可选依赖**，只有 `sync` / `sync-ui` / `dev-sync` feature 打开才进依赖图。
# 切片 1 只用它做 relay URL 策略校验与传输超时配置（`StdTcpTransport`），
# 不做任何真实 Create/Join/SyncOnce（那是切片 4）。
menghunote-sync = { path = "../sync", optional = true }
# 公开配置（ADR 0011）：`sync-ui`（及 `dev-sync`）需要序列化 JSON；只开 `sync` 不需要。
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# 秘密缓冲（setup secret / 恢复码）：drop 时清零，ADR 0011「缓冲用 Zeroizing」。
zeroize = { version = "1", optional = true }
# ADR 0019 §2 / S2a：图片预览的受控解码。`0.25.10` 早已在 lockfile 里（gpui-pre 的
# 传递依赖），这里只是显式声明并**精确 pin** 同一个版本，不引入新的版本/构建脚本；
# PNG/JPEG/WebP/GIF 是首版预览格式；BMP 仅用于 Windows 剪贴板（CF_DIB），落库前转 PNG。不加 SVG。
# 解码跑在 app 自己的后台线程上（见 `editor::object_image`），不走 gpui 的
# HTTP/file 资产加载器。
image = { version = "=0.25.10", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
] }
# Mermaid 渲染底座（M1，ADR 0019 §15 / docs/notes/editor-backlog-links-mermaid.md）。
# 纯 Rust，无 Node/Chromium/WebView、无远程渲染；`merman` 对齐 Mermaid 12.3。
# **精确 pin**（`=0.10.0`）：图渲染输出会进 Object Block 缓存/黄金测试，次版本升级
# 可能改变 SVG 结构，必须显式评审后再动。features：
# - `all-diagrams`：解析并渲染全部 Mermaid 图族（M1 只做底座，不按图族裁剪）；
# - `complete-svg` = `svg` + `layout-cytoscape`（缺省默认还含 `layout-elk`，那是 EPL
#   组件且体积大；M1 明确**不启用** ELK，行内写 `complete-svg` 以便一眼看出意图）。
# 调用封装在 `src/mermaid.rs`：输入/输出上限、`catch_unwind`、SVG 形状校验都在那里。
merman = { version = "=0.10.0", default-features = false, features = [
    "all-diagrams",
    "complete-svg",
] }
# 代码块只读语法高亮底座（纯 Rust）：`pulldown-cmark`（crates/markdown）负责认块
# 和 info，这里只做 token 着色。显式关掉默认 feature，避免拉 onig/C（vendor 的
# onig 会引入 C 编译，Windows 上还要撞本仓的 build script 限制）：
# - `parsing`：`ParseState` / `ScopeStack`（我们不用 `HighlightLines` 的 HTML 输出）；
# - `default-syntaxes`：内置 Sublime 语法 dump（纯 Rust，无文件 IO、无 yaml 解析）；
# - `regex-fancy`：fancy-regex 后端（纯 Rust）。
# 不启用 `default-themes` / `html` / `plist-load` / `yaml-load`：颜色由本仓
# 主题 token 决定，不读 `.tmTheme`，也不需要 HTML 渲染（`parsing` 所需的
# dump-load 是它的传递依赖，只有 bincode/flate2，无 C）。
syntect = { version = "5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }

[dev-dependencies]
# 原生 headless UI 测试（`#[gpui::test]` + `TestAppContext`）。
# 与主依赖**同名同包**：feature 只在测试构建里并集生效，`cargo build -p menghunote-app`
# 的产物不包含 test-support（不引入测试平台代码）。
gpui = { package = "gpui-kit", version = "=0.10.0", features = ["test-support"] }
# 每个测试一个独立临时库；目录建在 `CARGO_TARGET_TMPDIR` 下（AGENTS.md §6 禁止用 %TEMP%）。
tempfile = "3"
# ADR 0009 切片 4c-1：app 的 dev-sync 启动生命周期测试需要真实进程内 relay
# （`prepare(Create/Join)` 走真实 HTTP + genesis/bootstrap）。纯测试脚手架，
# 放行验签、只绑 loopback，**非生产**。
menghunote-dev-relay = { path = "../dev-relay" }

[target.'cfg(windows)'.dependencies]
# 启动时读回进程 DPI 感知级别（GetThreadDpiAwarenessContext / GetDpiForSystem）。
# 0.61 已在依赖图里（gpui 的 Windows 后端在用），特性只要 HiDpi。
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi"] }

# Windows exe 图标：build.rs 把 assets/app-icon.ico 编译进 exe。
# 只在 Windows 目标上生效；不参与 Linux/macOS 构建。
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0.12"
