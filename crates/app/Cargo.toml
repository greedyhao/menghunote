[package]
name = "menghunote-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# 应用层错误汇总（库层用 thiserror，见 AGENTS.md §4）
anyhow = "1"
# 依赖基线见 AGENTS.md §1 / ADR 0004：gpui-kit 是 gpui-pre 的门面（含 gpui-base/gpui-component）。
# **精确 pin**：升级必须整体对齐（kit/pre/base/component 版本互相约束），不能单边升。
# 用依赖别名把 lib 名固定成 `gpui`，代码里 `use gpui::*` 与 `gpui::platform::` 保持不变。
gpui = { package = "gpui-kit", version = "=0.9.1" }
# ADR 0003 §3：app 可以依赖 editor / storage / text，反向不允许
menghunote-editor = { path = "../editor" }
menghunote-storage = { path = "../storage" }

[target.'cfg(windows)'.dependencies]
# 启动时读回进程 DPI 感知级别（GetThreadDpiAwarenessContext / GetDpiForSystem）。
# 0.61 已在依赖图里（gpui 的 Windows 后端在用），特性只要 HiDpi。
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi"] }
