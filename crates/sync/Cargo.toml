[package]
name = "menghunote-sync"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
menghunote-storage = { path = "../storage" }
menghunote-sync-proto = { path = "../sync-proto" }

# relay 的传输层 TLS（评审 0002「生产阻断」）：客户端必须真实校验证书链/主机名/有效期。
# - 选 rustls 而不是 native-tls/openssl：纯 Rust、无 OpenSSL 系统依赖（Windows 免装/免交叉
#   编译工具链），且本仓已通过 gpui-pre-reqwest → hyper-rustls → rustls 0.23 传递依赖 ring，
#   显式启用同一后端不新增编译负担；
# - default-features = false 避免 rustls 的默认 aws-lc-rs 后端（需 C/cmake/NASM，且会与本仓
#   现有 ring 后端并存）；只启用 ring + std + tls12；
# - rustls-native-certs 读系统证书存储（Windows 用 schannel 提供的根证书，Linux/macOS 用
#   SSL_CERT_FILE/SSL_CERT_DIR 或平台存储），比把 webpki-roots 的 Mozilla 根打进二进制更贴近
#   系统信任策略；测试/私有 CA 可用 `StdTcpTransport::with_extra_roots` 注入。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

# 密钥派生与 AEAD（ADR 0006 §2/§3）：
# - Argon2id 是口令 KEK 的唯一 KDF（m=64MiB/t=3/p=1，salt16/out32）；
# - HKDF-SHA256 分用途子密钥（域分隔符见 domain.rs，§14 要求真正的 0x00 结尾）；
# - XChaCha20-Poly1305 是 v1 唯一的密文套件（cipher_suite=1），槽体/数据对象共用。
argon2 = "0.5"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"

# 设备签名（RFC 8032 Ed25519）。`zeroize` 让 SigningKey drop 时擦除种子。
ed25519-dalek = { version = "2", features = ["zeroize"] }

# HPKE RFC 9180 base mode：KEM 0x0020 / KDF 0x0001 / AEAD 0x0003（ADR 0006 §4）。
# 只开需要的特性，避免把 ML-KEM/SHAKE 等 PQ 套件一并编进来。
# `getrandom` 是 hpke 内部生成临时 X25519 密钥的唯一随机源；nonce 由 HPKE 自身
# 按 RFC 9180 §5.2 的 seq 派生，**不在这里自造**。
hpke = { version = "0.15.1", default-features = false, features = [
    "alloc",
    "x25519",
    "chacha",
    "getrandom",
] }

# 恢复码编码（BIP-350 Bech32m，HRP=mnrec）。
bech32 = "0.11"

# 秘密类型：Zeroizing + 常量时间比较。
zeroize = { version = "1", features = ["zeroize_derive"] }
subtle = "2"

# 随机字节：统一走 getrandom（失败可返回错误，不像 OsRng 那样 panic）。
getrandom = "0.2"
thiserror = "2"

# 同步引擎的依赖判定需要解码 base_vv/end_vv（`VersionVector`）。与 storage 同一版本，
# 不新增构建负担；ADR §11 步 4 明确 sync 侧负责 Loro import 的本地 seq 分配。
loro = "1.17.1"

# checkpoint 资产对象名 = HMAC(K_asset_id, real_sha256)（ADR §2/§5）；纯 Rust，
# hkdf 已传递依赖 hmac，这里显式声明以直接使用（不引入新传递树）。
hmac = "0.12"

[dev-dependencies]
# 测试临时目录必须落在 CARGO_TARGET_TMPDIR（本机 cargo 子进程不能写 %TEMP%）。
tempfile = "3"
# TLS 测试用自签 CA / 叶子证书（含过期、错 hostname 场景）：只在测试里生成，不进生产依赖。
# ring 后端与 rustls 共用同一套 crypto provider，不额外引入 C 编译。
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }

# task-120：e2e example 的**进程内** relay（临时 SQLite + FakeClock + loopback 放行验签 hook +
# `127.0.0.1:0` + 独立线程 axum），已抽成独立、仅测试使用的 crate `menghunote-dev-relay`
# （crates/dev-relay）。它只允许出现在 [dev-dependencies]；生产 sync 依然只经 HTTP 访问 relay。
menghunote-dev-relay = { path = "../dev-relay" }
# e2e_rotation_two_rounds 会直接断言 relay 的 checkpoint 行（`CheckpointState`/prune 骨架），
# 因此本 crate 的 example 仍需要 relay 的类型；tokio/axum 只被 harness 使用，随之移到
# dev-relay crate，避免在每个使用方重复声明。
menghunote-relay = { path = "../relay" }

[target.'cfg(windows)'.dependencies]
# DPAPI（CryptProtectData/CryptUnprotectData，CurrentUser，ADR 0006 §3）。
# 只开两个必需特性，避免引入整个 Win32 面。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Linux 本地身份封装（ADR 0008）：安全敏感文件操作需要 O_NOFOLLOW / fstat /
# renameat2(RENAME_NOREPLACE) / 目录 fsync；std 不暴露这些，rustix 是最小且纯 Rust 的
# 选择（Cargo.lock 已有 1.1.6，不新增依赖树）。`fs` 提供文件/目录原语，`process`
# 仅用于 `geteuid()` 校验主密钥属主（Linux 上没有稳定的 std 等价物）。
rustix = { version = "1.1", features = ["fs", "process"] }
